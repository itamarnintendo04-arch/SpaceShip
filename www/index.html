<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05021a">
<title>SpaceShip</title>
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bgfx"></canvas>
<div id="app">

  <!-- Loading: a mini level to play while the game connects -->
  <section id="s-loading" class="screen game">
    <canvas id="ld-canvas"></canvas>
    <div class="ld-ui">
      <h1 class="title">SpaceShip</h1>
      <div class="ld-bar"><i id="ld-fill"></i></div>
      <div class="ld-text" id="ld-text"></div>
      <button class="btn primary big hidden" id="ld-go"><span data-ic="play"></span><span data-t="play"></span></button>
    </div>
  </section>

  <!-- Register -->
  <section id="s-register" class="screen">
    <div class="card narrow">
      <img src="icon.png" class="logo" alt="">
      <h1 class="title">SpaceShip</h1>
      <button class="chip lang-chip" id="r-lang"></button>
      <div class="tabs" id="r-tabs"><button class="tab on" data-rt="new"><span data-t="tab_new"></span></button><button class="tab" data-rt="login"><span data-t="tab_have"></span></button></div>
      <div id="r-new" class="col">
      <p class="muted" data-t="reg_sub"></p>
      <label><span data-t="your_name"></span><input id="r-name" maxlength="24" data-tp="name_ph"></label>
      <label><span data-t="unique_handle"></span>
        <div class="handle-input"><span>@</span><input id="r-handle" maxlength="20" dir="ltr" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="dani_pilot"></div>
      </label>
      <div id="r-status" class="status"></div>
      <div class="lbl" data-t="pick_icon"></div>
      <div id="r-avatars" class="avatar-row"></div>
      <div id="r-cvbanner" class="cv-banner hidden"></div>
      <button id="r-go" class="btn primary big" data-t="lets_go"></button>
      </div>
      <div id="r-login" class="col hidden">
        <div id="l-saved"></div>
        <div id="l-status" class="status"></div>
        <button id="l-go" class="btn primary big"><span data-t="login_email_title"></span></button>
        <button id="l-key" class="btn">🔑 <span data-t="key_login"></span></button>
      </div>
      <div class="or"><span data-t="or"></span></div>
      <button id="r-cutvid" class="btn cutvid"><span data-ic="cutvid"></span><span data-t="cutvid_btn"></span></button>
      <button id="r-offline" class="btn ghost hidden" data-t="play_offline"></button>
    </div>
  </section>

  <!-- Menu -->
  <section id="s-menu" class="screen">
    <header class="topbar">
      <div class="me" id="m-me"></div>
      <div class="coins" id="m-coins"></div>
    </header>
    <div class="menu-body">
      <div class="hero">
        <canvas id="m-ship" width="200" height="200"></canvas>
        <h1 class="title">SpaceShip</h1>
      </div>
      <div id="m-events" class="ev-list"></div>
      <div class="menu-grid">
        <button class="btn primary big" data-go="levels"><span data-ic="play"></span><span data-t="levels"></span></button>
        <button class="btn big" data-act="endless"><span data-ic="infinity"></span><span data-t="endless"></span></button>
        <button class="btn big coop" data-go="coop"><span data-ic="friends"></span><span data-t="play_friend"></span></button>
        <button class="btn big" data-go="shop"><span data-ic="shop"></span><span data-t="shop"></span></button>
        <button class="btn" id="m-choose"><span data-ic="rocket"></span><span data-t="choose_tab"></span></button>
        <button class="btn" data-go="friends"><span data-ic="friends"></span><span data-t="friends"></span> <i id="m-online" class="badge hidden"></i></button>
        <button class="btn" data-go="board"><span data-ic="trophy"></span><span data-t="records"></span></button>
        <button class="btn gift-btn" id="m-gift"><span data-ic="gift"></span><span data-t="coupons"></span><i class="badge-dot hidden" id="m-gift-dot"></i></button>
        <button class="btn big local2 hidden" id="m-local2"><span data-ic="keyboard"></span><span data-t="local2"></span></button>
      </div>
      <div class="toggles">
        <button class="chip" id="t-orient"></button>
        <button class="chip" id="t-sound"></button>
        <button class="chip" id="t-lang"></button>
        <button class="chip" id="t-notif"></button>
        <button class="chip" id="t-settings"><span data-ic="gear"></span><span data-t="settings"></span></button>
      </div>
      <div id="m-desk" class="desk-hint hidden" data-t="desk_hint"></div>
      <div id="m-offline" class="offline hidden"><span data-t="offline_mode"></span> <a href="#" id="m-reg" data-t="connect_server"></a></div>
    </div>
  </section>

  <!-- Levels -->
  <section id="s-levels" class="screen">
    <header class="topbar"><button class="icon-btn" data-back><span data-ic="back"></span></button><h2 data-t="levels"></h2><div class="coins" data-coins></div></header>
    <div id="lv-grid" class="lv-grid"></div>
  </section>

  <!-- Shop -->
  <section id="s-shop" class="screen">
    <header class="topbar"><button class="icon-btn" data-back><span data-ic="back"></span></button><h2 data-t="shop"></h2><div class="coins" data-coins></div></header>
    <div class="tabs" id="shop-tabs">
      <button class="tab on" data-tab="ships" data-t="ships"></button>
      <button class="tab" data-tab="up" data-t="upgrades"></button>
      <button class="tab" data-tab="avatars" data-t="icons"></button>
      <button class="tab gemtab" data-tab="gems"><span data-ic="gem"></span><span data-t="special"></span></button>
    </div>
    <div id="shop-list" class="shop-list"></div>
  </section>

  <!-- Friends -->
  <section id="s-friends" class="screen">
    <header class="topbar"><button class="icon-btn" data-back><span data-ic="back"></span></button><h2 data-t="friends"></h2><div></div></header>
    <div class="tabs" id="f-tabs"><button class="tab on" data-ft="friends" data-t="friends"></button><button class="tab" data-ft="parties" data-t="parties"></button></div>
    <div class="scroll">
      <div id="f-pane-friends">
        <div class="card">
          <div class="lbl" data-t="find_friends"></div>
          <input id="f-search" dir="auto" autocapitalize="off" autocomplete="off" spellcheck="false" data-tp="search_players_ph">
          <div id="f-results" class="list" style="margin-top:8px"></div>
        </div>
        <div id="f-reqs"></div>
        <div class="lbl pad" data-t="my_friends"></div>
        <div id="f-list" class="list"></div>
      </div>
      <div id="f-pane-parties" class="hidden">
        <button class="btn primary big" id="p-create" style="width:100%;margin-bottom:12px"><span data-ic="plus"></span><span data-t="create_party"></span></button>
        <div id="p-invites" class="list"></div>
        <div class="lbl pad" data-t="my_parties"></div>
        <div id="p-mine" class="list"></div>
        <div class="card" style="margin-top:12px">
          <input id="p-search" dir="auto" autocapitalize="off" autocomplete="off" spellcheck="false" data-tp="search_parties_ph">
          <div id="p-results" class="list" style="margin-top:8px"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Co-op -->
  <section id="s-coop" class="screen">
    <header class="topbar"><button class="icon-btn" data-back><span data-ic="back"></span></button><h2 data-t="play_friend"></h2><div></div></header>
    <div class="scroll">
      <div id="c-start">
        <div class="card">
          <h3 data-t="create_room"></h3>
          <p class="muted small" data-t="create_room_help"></p>
          <button class="btn primary big" id="c-create" data-t="create_new_room"></button>
        </div>
        <div class="card">
          <h3 data-t="join_code"></h3>
          <div class="row"><input id="c-code" maxlength="5" dir="ltr" placeholder="XXXXX" autocapitalize="characters"><button class="btn" id="c-join" data-t="join"></button></div>
          <div id="c-status" class="status"></div>
        </div>
        <div class="card">
          <h3 data-t="invite_friend"></h3>
          <p class="muted small" data-t="online_friends_help"></p>
          <div id="c-friends" class="list"></div>
        </div>
      </div>
      <div id="c-lobby" class="hidden">
        <div class="card center">
          <div class="lbl" data-t="room_code"></div>
          <div class="room-code" id="c-roomcode" dir="ltr"></div>
          <button class="chip" id="c-copy"><span data-ic="copy"></span><span data-t="copy"></span></button>
          <div class="muted small" id="c-count" style="margin-top:8px"></div>
          <div class="room-players" id="c-players"></div>
          <button class="btn big" id="c-ready"></button>
          <div class="chosen" id="c-chosen"></div>
          <p id="c-wait" class="muted hidden" data-t="waiting_host"></p>
        </div>
        <p class="center ready-go hidden" id="c-auto"></p>
        <div id="c-hostctl" class="hidden">
          <div class="lbl pad" data-t="choose_game"></div>
          <div id="c-pick" class="room-pick"></div>
          <p class="muted small center" id="c-need" data-t="need_ready"></p>
          <button class="btn primary big" id="c-go" disabled data-t="start" style="width:100%"></button>
        </div>
        <button class="btn ghost" id="c-leave" data-t="leave_room" style="width:100%"></button>
      </div>
    </div>
  </section>

  <!-- Leaderboard -->
  <section id="s-board" class="screen">
    <header class="topbar"><button class="icon-btn" data-back><span data-ic="back"></span></button><h2 data-t="board_title"></h2><div></div></header>
    <div class="scroll"><div id="b-list" class="list"></div></div>
  </section>

  <!-- Game -->
  <section id="s-game" class="screen game">
    <canvas id="game"></canvas>
    <button class="icon-btn pause" id="g-pause"><span data-ic="pause"></span></button>
    <div id="g-rotate" class="rotate-hint hidden"><span data-ic="rotateL"></span><span data-t="rotate_hint"></span></div>
  </section>
</div>

<!-- Modals -->
<div id="modal" class="modal hidden"><div class="card modal-card" id="modal-card"></div></div>
<div id="toast" class="toast"></div>

<script src="vendor/supabase.js"></script>
<script src="js/version.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/art.js"></script>
<script src="js/net.js"></script>
<script src="js/game.js"></script>
<script src="js/music.js"></script>
<script src="js/app.js"></script>
</body>
</html>
