name: Build SpaceShip apps

# Every push (except changes to only the website or docs) builds every app:
# Android, Windows, Linux, macOS and iOS. The repository is public, so Actions minutes are free.
# Can also be started by hand: Actions -> Build SpaceShip apps -> Run workflow.
# Replacing an older release instead of making a new one: put [replace release-N] in the commit message
# (and optionally [delete release-M] to remove another release). The build then waits (up to 3 hours) for earlier runs to finish,
# deletes those releases and publishes into release-N (version 1.1.N; the Android version code still goes up).
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['site/**', 'supabase/**', '**.md', '.github/release-cleanup.txt', '.github/workflows/delete-release.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# one build at a time: a newer push waits for the running build instead of racing it
# (if several are waiting, only the newest one runs - it contains everything)
concurrency:
  group: build-apps
  cancel-in-progress: false

env:
  VERSION_CODE: ${{ github.run_number }}0

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Release name (new, or replacing an older one)
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          N=$(printf '%s' "$MSG" | grep -oE '\[replace release-[0-9]+\]' | grep -oE '[0-9]+' | head -1 || true)
          if [ -n "$N" ]; then
            # wait for earlier runs of this workflow so they can't re-create what we delete
            for i in $(seq 1 360); do
              busy=$(gh run list -R "$GITHUB_REPOSITORY" -w "${{ github.workflow }}" --limit 20 --json databaseId,status \
                --jq "[.[] | select(.databaseId < ${{ github.run_id }} and .status != \"completed\")] | length")
              [ "$busy" = "0" ] && break; echo "waiting for $busy earlier run(s)"; sleep 30
            done
            for R in release-$N $(printf '%s' "$MSG" | grep -oE '\[delete release-[0-9]+\]' | grep -oE 'release-[0-9]+' || true); do
              gh release delete "$R" -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true
            done
            echo "tag=release-$N" >> "$GITHUB_OUTPUT"; echo "version=1.1.$N" >> "$GITHUB_OUTPUT"
          else
            echo "tag=release-${{ github.run_number }}" >> "$GITHUB_OUTPUT"; echo "version=1.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: SpaceShip ${{ steps.tag.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **SpaceShip ${{ steps.tag.outputs.version }}** (${{ github.ref_name }})

            | Device | File |
            |---|---|
            | Android | `SpaceShip.apk` (open it on the phone and install) |
            | Windows | `SpaceShip-Setup-….exe` (installer) or `SpaceShip-Portable-….exe` (no install) |
            | Linux | `SpaceShip-….AppImage` |
            | macOS | `SpaceShip-…-mac.dmg` (first launch: right-click → Open) |
            | iPhone / iPad | `SpaceShip-iOS-unsigned.ipa` (unsigned, install with Sideloadly / AltStore) |

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run vendor
      - run: echo "window.SS_VERSION = '${{ needs.release.outputs.version }}';" > www/js/version.js
      - run: npx cap add android && node scripts/patch-native.mjs
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#05021a' --splashBackgroundColor '#05021a'
      - name: Set version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ env.VERSION_CODE }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ needs.release.outputs.version }}\"/" android/app/build.gradle
      - run: npx cap sync android
      - name: Build APK
        run: |
          mkdir -p ~/.android && cp android-debug.keystore ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SpaceShip.apk
      - uses: softprops/action-gh-release@v2
        with: { tag_name: '${{ needs.release.outputs.tag }}', files: SpaceShip.apk }

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - shell: bash
        run: |
          npm ci
          npm run vendor
          echo "window.SS_VERSION = '${{ needs.release.outputs.version }}';" > www/js/version.js
          npm version ${{ needs.release.outputs.version }} --no-git-tag-version --allow-same-version
          npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            dist-desktop/*.exe
            dist-desktop/*.AppImage
            dist-desktop/*.dmg

  ios:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run vendor
      - run: echo "window.SS_VERSION = '${{ needs.release.outputs.version }}';" > www/js/version.js
      - run: npx cap add ios && node scripts/patch-native.mjs
        env:
          # optional repo variable: links the app to the website for Apple Passwords (see README)
          IOS_ASSOCIATED_DOMAIN: ${{ vars.IOS_ASSOCIATED_DOMAIN }}
      - run: npx capacitor-assets generate --ios --iconBackgroundColor '#05021a' --splashBackgroundColor '#05021a'
      - run: npx cap sync ios
      - name: Build unsigned IPA
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios-build \
            MARKETING_VERSION=${{ needs.release.outputs.version }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS=YES \
            ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES="AppIconEmerald AppIconOcean AppIconSunset AppIconAqua AppIconRose" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R ios-build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr SpaceShip-iOS-unsigned.ipa Payload
      - uses: softprops/action-gh-release@v2
        with: { tag_name: '${{ needs.release.outputs.tag }}', files: SpaceShip-iOS-unsigned.ipa }
